<title>스도쿠 교실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#FFF9EF; --paper-raised:#FFFFFF; --paper-sunk:#F6EEDD;
    --ink:#1F2433; --ink-soft:#4B5163; --muted:#776D5C;
    --line:#EADFCB; --line-strong:#D3C6AA;
    --accent:#2E8B6F; --accent-ink:#1D5E4B; --accent-soft:#E2F3EC;
    --warm:#E0662A; --warm-ink:#9C4216; --warm-soft:#FDEBDD;
    --bad:#D04A3F; --bad-soft:#FBE4E1;
    --gold:#E9A90C; --gold-soft:#FFF1C2;
    --given:#1F2433; --userval:#2459A8;
    --on-mc:#FFFFFF;
    --c-overall:#2E8B6F; --c-overall-soft:#E2F3EC;
    --c-practice:#5B7FA6; --c-practice-soft:#E6EEF7;
    --c-easy:#2E9B55;   --c-easy-soft:#E1F5E8;
    --c-medium:#2C74CC; --c-medium-soft:#E2EEFB;
    --c-hard:#D9601F;   --c-hard-soft:#FDEBDD;
    --c-expert:#8A4BD3; --c-expert-soft:#F0E6FB;
    --shadow: rgba(31,36,51,.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#141821; --paper-raised:#1C222D; --paper-sunk:#10141B;
      --ink:#EEE9DE; --ink-soft:#C9C3B5; --muted:#9A917D;
      --line:#2B323E; --line-strong:#3E4757;
      --accent:#5FC39E; --accent-ink:#9EDDC4; --accent-soft:#1A2E27;
      --warm:#F0945C; --warm-ink:#F7BE92; --warm-soft:#3A2619;
      --bad:#EE7B70; --bad-soft:#3B2321;
      --gold:#F2C443; --gold-soft:#3A3117;
      --given:#EEE9DE; --userval:#8FB8F0;
      --on-mc:#10141B;
      --c-overall:#5FC39E; --c-overall-soft:#1A2E27;
      --c-practice:#8FB1D6; --c-practice-soft:#1E2836;
      --c-easy:#5BCB82;   --c-easy-soft:#173022;
      --c-medium:#64A6F0; --c-medium-soft:#172739;
      --c-hard:#F09A63;   --c-hard-soft:#3A2618;
      --c-expert:#B98AF0; --c-expert-soft:#2A1F3A;
      --shadow: rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --paper:#141821; --paper-raised:#1C222D; --paper-sunk:#10141B;
    --ink:#EEE9DE; --ink-soft:#C9C3B5; --muted:#9A917D;
    --line:#2B323E; --line-strong:#3E4757;
    --accent:#5FC39E; --accent-ink:#9EDDC4; --accent-soft:#1A2E27;
    --warm:#F0945C; --warm-ink:#F7BE92; --warm-soft:#3A2619;
    --bad:#EE7B70; --bad-soft:#3B2321;
    --gold:#F2C443; --gold-soft:#3A3117;
    --given:#EEE9DE; --userval:#8FB8F0;
    --on-mc:#10141B;
    --c-overall:#5FC39E; --c-overall-soft:#1A2E27;
    --c-practice:#8FB1D6; --c-practice-soft:#1E2836;
    --c-easy:#5BCB82;   --c-easy-soft:#173022;
    --c-medium:#64A6F0; --c-medium-soft:#172739;
    --c-hard:#F09A63;   --c-hard-soft:#3A2618;
    --c-expert:#B98AF0; --c-expert-soft:#2A1F3A;
    --shadow: rgba(0,0,0,.5);
  }
  :root{ --mc:var(--accent); --mc-soft:var(--accent-soft); }
  .m-overall{ --mc:var(--c-overall); --mc-soft:var(--c-overall-soft); }
  .m-practice{ --mc:var(--c-practice); --mc-soft:var(--c-practice-soft); }
  .m-easy{ --mc:var(--c-easy); --mc-soft:var(--c-easy-soft); }
  .m-medium{ --mc:var(--c-medium); --mc-soft:var(--c-medium-soft); }
  .m-hard{ --mc:var(--c-hard); --mc-soft:var(--c-hard-soft); }
  .m-expert{ --mc:var(--c-expert); --mc-soft:var(--c-expert-soft); }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans KR","Pretendard",sans-serif; line-height:1.55;
  }
  h1,h2,h3{ font-family:"Jua","IBM Plex Sans KR",sans-serif; font-weight:400; text-wrap:balance; margin:0; }
  button{ font-family:inherit; }
  .mono{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }
  button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible{
    outline:3px solid var(--accent); outline-offset:2px;
  }
  [hidden]{ display:none !important; }

  #app{ max-width:1000px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }

  /* ---------- top bar / menu ---------- */
  #topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:10px;
    padding:10px 20px; background:var(--paper); border-bottom:1.5px solid var(--line);
  }
  .brand{
    display:flex; align-items:center; gap:8px; background:none; border:none; cursor:pointer;
    color:var(--ink); font-family:"Jua",sans-serif; font-size:21px; padding:4px 6px; border-radius:10px;
  }
  #topbar-info{ flex:1; min-width:0; display:flex; gap:8px; align-items:center; overflow:hidden; }
  .pill{
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
    background:var(--accent-soft); color:var(--accent-ink);
    border-radius:999px; padding:4px 12px; font-size:12.5px; font-weight:600;
  }
  .pill .av{ font-size:15px; }
  .pill.warm{ background:var(--warm-soft); color:var(--warm-ink); }
  .topnav{ display:flex; gap:6px; flex:0 0 auto; }
  .nav-btn{
    display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
    border:1.5px solid var(--line-strong); background:var(--paper-raised); color:var(--ink-soft);
    border-radius:999px; padding:7px 13px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .nav-btn:hover{ border-color:var(--accent); color:var(--accent-ink); }
  .nav-btn.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .nav-btn.teacher.active{ background:var(--warm); border-color:var(--warm); color:#fff; }
  @media (max-width:680px){
    #topbar{ padding:10px 16px; gap:8px; }
    .nav-btn .lbl{ display:none; }
    .nav-btn.teacher .lbl{ display:inline; font-size:13px; }
    .nav-btn{ padding:7px 10px; font-size:15px; }
    .pill.warm{ display:none; }
  }
  @media (max-width:520px){ #topbar.has-user .brand-text{ display:none; } }

  main#view{ flex:1; padding:28px 20px 70px; }
  @media (max-width:680px){ main#view{ padding:20px 16px 60px; } }

  /* ---------- generic ---------- */
  .center-wrap{ max-width:560px; margin:0 auto; }
  .stage-tag{ font-size:12.5px; font-weight:600; letter-spacing:.02em; color:var(--muted); margin:0 0 6px; }
  .page-title{ font-size:clamp(26px,4.5vw,34px); margin-bottom:10px; }
  .lede{ color:var(--muted); font-size:15px; margin:0 0 22px; }
  .hint{ font-size:12.5px; color:var(--muted); margin:6px 0 0; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:12px; padding:13px 22px; font-size:15px; font-weight:700;
    cursor:pointer; transition:transform .08s ease;
  }
  .btn:active{ transform:translateY(2px); }
  .btn-primary{ background:var(--accent); color:var(--on-mc); box-shadow:0 4px 0 var(--accent-ink); }
  .btn-warm{ background:var(--warm); color:#fff; box-shadow:0 4px 0 var(--warm-ink); }
  .btn-mode{ background:var(--mc); color:var(--on-mc); box-shadow:0 4px 0 rgba(0,0,0,.2); }
  .btn-outline{ background:var(--paper-raised); border:2px solid var(--line-strong); color:var(--ink); }
  .btn-outline:hover{ border-color:var(--accent); color:var(--accent-ink); }
  .btn-block{ width:100%; }
  .btn-xl{ font-size:19px; padding:17px 34px; border-radius:16px; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }
  .linkish{ background:none; border:none; color:var(--accent-ink); font-weight:700; font-size:13px; cursor:pointer; padding:6px 0 0; }

  .field{ margin-bottom:16px; }
  .field label, .field .label{ display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field select{
    width:100%; padding:12px 14px; border-radius:10px; border:2px solid var(--line);
    background:var(--paper-raised); color:var(--ink); font-size:15px;
  }
  .field input:focus, .field select:focus{ border-color:var(--accent); }
  .err-text{ color:var(--bad); font-size:13px; margin-top:8px; }
  .card{ background:var(--paper-raised); border:1.5px solid var(--line); border-radius:16px; padding:22px; }

  /* ---------- home ---------- */
  .hero{ display:grid; grid-template-columns:1.25fr .75fr; gap:34px; align-items:center; padding:16px 0 6px; }
  @media (max-width:760px){ .hero{ grid-template-columns:1fr; text-align:center; gap:22px; } .hero-art{ order:-1; } .diff-chips, .hero .btn-row{ justify-content:center; } }
  .kicker{ display:inline-block; background:var(--warm-soft); color:var(--warm-ink); font-weight:700; font-size:13px; padding:5px 13px; border-radius:999px; margin-bottom:14px; }
  .hero h1{ font-size:clamp(36px,6.4vw,56px); line-height:1.15; margin-bottom:14px; }
  .hero h1 .hl{ color:var(--accent); }
  .hero .lede{ font-size:16px; }
  .diff-chips{ display:flex; gap:8px; flex-wrap:wrap; margin-top:24px; }
  .dchip{ padding:6px 13px; border-radius:999px; background:var(--mc-soft); color:var(--mc); font-weight:700; font-size:13px; }
  .hero-art{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; max-width:270px; width:100%; margin:0 auto; }
  .tile{
    aspect-ratio:1; border-radius:16px; display:flex; align-items:center; justify-content:center;
    font-family:"Jua",sans-serif; font-size:32px; color:var(--on-mc); background:var(--mc);
    box-shadow:0 5px 0 rgba(0,0,0,.16); animation:bob 3.2s ease-in-out infinite;
  }
  .tile.blank{ background:var(--paper-raised); box-shadow:inset 0 0 0 2.5px var(--line-strong); color:var(--muted); }
  @keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-7px); } }
  .features{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:40px; }
  @media (max-width:760px){ .features{ grid-template-columns:1fr; } }
  .feature{ background:var(--paper-raised); border:1.5px solid var(--line); border-radius:16px; padding:18px 18px 16px; }
  .feature .ico{ font-size:28px; }
  .feature h3{ font-size:19px; margin:6px 0 4px; }
  .feature p{ margin:0; color:var(--muted); font-size:13.5px; }

  /* ---------- entry ---------- */
  .avatar-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
  .av-btn{
    font-size:26px; aspect-ratio:1; border-radius:12px; border:2px solid var(--line);
    background:var(--paper-raised); cursor:pointer; transition:transform .1s; padding:0;
  }
  .av-btn:hover{ border-color:var(--line-strong); }
  .av-btn.sel{ border-color:var(--accent); background:var(--accent-soft); transform:scale(1.07); }

  /* ---------- rules / size ---------- */
  .demo4{ display:grid; grid-template-columns:repeat(4,46px); grid-template-rows:repeat(4,46px); border:3px solid var(--ink); margin:18px auto; width:max-content; border-radius:8px; overflow:hidden; }
  .demo4 div{ display:flex; align-items:center; justify-content:center; border:1px solid var(--line); font-family:"Jua",sans-serif; font-size:22px; background:var(--paper-raised); cursor:pointer; }
  .rule-step{ display:flex; gap:14px; padding:13px 0; border-bottom:1px solid var(--line); align-items:flex-start; }
  .rule-step:last-of-type{ border-bottom:none; }
  .rule-step .n{ font-family:"Jua",sans-serif; color:var(--on-mc); background:var(--accent); width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .choice-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }
  .choice-card{
    background:var(--paper-raised); border:2px solid var(--line); border-radius:16px;
    padding:20px 18px; cursor:pointer; text-align:left; transition:border-color .12s, transform .08s;
  }
  .choice-card:hover{ border-color:var(--accent); transform:translateY(-2px); }
  .choice-card h3{ font-size:22px; margin-bottom:4px; }
  .choice-card p{ margin:0; font-size:13px; color:var(--muted); }
  .size-swatch{ display:inline-grid; gap:2px; margin-bottom:12px; background:var(--line-strong); padding:2px; border-radius:4px; }
  .size-swatch div{ width:7px; height:7px; background:var(--paper-sunk); }

  /* ---------- mode tabs ---------- */
  .mode-tabs{ display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px; margin:0 auto 4px; justify-content:center; scrollbar-width:none; }
  .mode-tabs::-webkit-scrollbar{ display:none; }
  .mode-tabs.left{ justify-content:flex-start; }
  @media (max-width:680px){ .mode-tabs{ justify-content:flex-start; } }
  .mode-tab{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:6px;
    border:2px solid var(--line-strong); background:var(--paper-raised); color:var(--ink-soft);
    border-radius:999px; padding:9px 16px; font-size:14.5px; font-weight:700; cursor:pointer;
  }
  .mode-tab:hover:not(:disabled){ border-color:var(--mc); color:var(--mc); }
  .mode-tab.active, .mode-tab.active:hover{ background:var(--mc); border-color:var(--mc); color:var(--on-mc); box-shadow:0 4px 0 rgba(0,0,0,.16); }
  .mode-tab:disabled{ opacity:.42; cursor:not-allowed; }
  @media (max-width:520px){
    .mode-tabs{ gap:6px; justify-content:stretch; }
    .mode-tabs.left{ justify-content:stretch; }
    .mode-tab{ flex:1 1 0; min-width:0; flex-direction:column; gap:0; padding:6px 4px; font-size:12.5px; border-radius:14px; line-height:1.3; }
  }
  .assign-note{ text-align:center; font-size:13px; font-weight:600; color:var(--warm-ink); margin:0 0 4px; }

  /* ---------- play ---------- */
  .play-head{ text-align:center; margin-bottom:12px; }
  .play-wrap{ display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start; justify-content:center; }
  .board-col{ flex:1 1 360px; display:flex; flex-direction:column; align-items:center; max-width:460px; }
  .side-col{ flex:0 0 260px; display:flex; flex-direction:column; gap:14px; }
  @media (max-width:760px){ .side-col{ flex:1 1 100%; } }
  .bw{ width:min(calc(100vw - 32px),440px); }

  .progress-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .progress{ flex:1; height:14px; background:var(--paper-sunk); border-radius:999px; overflow:hidden; box-shadow:inset 0 0 0 1.5px var(--line); }
  .progress-fill{ height:100%; width:0; background:var(--mc); border-radius:999px; transition:width .35s ease; }
  .progress-text{ font-size:12px; color:var(--muted); font-weight:600; white-space:nowrap; }

  .board-wrap{ position:relative; }
  #board{
    display:grid; border:3px solid var(--ink); background:var(--line);
    aspect-ratio:1; border-radius:12px; overflow:hidden; box-shadow:0 6px 0 var(--line-strong);
  }
  .cell{
    background:var(--paper-raised); display:flex; align-items:center; justify-content:center;
    position:relative; cursor:pointer; user-select:none; transition:background .12s;
  }
  .cell:hover{ background:var(--paper-sunk); }
  .cell .v{ font-family:"Jua",sans-serif; line-height:1; }
  .cell.given .v{ color:var(--given); }
  .cell.user .v{ color:var(--userval); }
  .cell.peer{ background:var(--paper-sunk); }
  .cell.same{ background:var(--mc-soft); }
  .cell.selected{ background:var(--mc-soft); box-shadow:inset 0 0 0 3px var(--mc); }
  .cell.error{ background:var(--bad-soft); }
  .cell.error .v{ color:var(--bad); }
  .cell.hinted .v{ text-decoration:underline wavy var(--warm) 1.5px; text-underline-offset:3px; }
  .cell.pop .v{ animation:pop .32s ease; }
  .cell.shake{ animation:shake .36s ease; }
  .cell.flash{ animation:flash .8s ease; }
  @keyframes pop{ 0%{ transform:scale(.6); } 55%{ transform:scale(1.22); } 100%{ transform:scale(1); } }
  @keyframes shake{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-4px); } 40%{ transform:translateX(4px); } 60%{ transform:translateX(-3px); } 80%{ transform:translateX(2px); } }
  @keyframes flash{ 0%,55%{ background:var(--gold-soft); } 100%{ background:var(--paper-raised); } }
  .notes-grid{ position:absolute; inset:2px; display:grid; }
  .notes-grid span{ display:flex; align-items:center; justify-content:center; font-family:"IBM Plex Mono",monospace; color:var(--muted); font-weight:500; }

  .combo-pop{
    position:absolute; left:50%; top:40%; transform:translate(-50%,-50%);
    font-family:"Jua",sans-serif; font-size:32px; color:var(--warm); white-space:nowrap; pointer-events:none;
    text-shadow:0 2px 0 var(--paper), 0 0 14px var(--paper);
  }
  .combo-pop.go{ animation:rise .95s ease forwards; }
  @keyframes rise{ 0%{ opacity:0; transform:translate(-50%,-30%) scale(.7); } 20%{ opacity:1; transform:translate(-50%,-50%) scale(1.12); } 100%{ opacity:0; transform:translate(-50%,-120%) scale(1); } }

  .pad{ display:grid; gap:7px; margin-top:18px; }
  .pad button{
    position:relative; height:52px; border-radius:12px; border:2px solid var(--line-strong);
    background:var(--paper-raised); color:var(--ink); font-family:"Jua",sans-serif; font-size:24px; cursor:pointer;
    box-shadow:0 3px 0 var(--line-strong); padding:0;
  }
  .pad button:hover{ border-color:var(--mc); color:var(--mc); }
  .pad button:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--line-strong); }
  .pad .pc{ position:absolute; top:2px; right:5px; font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--muted); font-weight:600; }
  .pad button.done{ opacity:.38; }
  @media (max-width:480px){ .pad button{ height:46px; font-size:21px; } }
  .toolrow{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; justify-content:center; }
  .toolrow button{ font-size:13px; font-weight:600; padding:8px 13px; border-radius:10px; border:2px solid var(--line-strong); background:var(--paper-raised); color:var(--ink-soft); cursor:pointer; }
  .toolrow button:hover:not(:disabled){ border-color:var(--mc); color:var(--ink); }
  .toolrow button.active{ border-color:var(--mc); color:var(--ink); background:var(--mc-soft); }
  .toolrow button:disabled{ opacity:.45; cursor:not-allowed; }

  .stat-row{ display:flex; gap:8px; }
  .stat-tile{ flex:1; min-width:0; background:var(--paper-raised); border:1.5px solid var(--line); border-radius:12px; padding:9px 11px; }
  .stat-tile .lab{ font-size:11px; color:var(--muted); font-weight:600; }
  .stat-tile .val{ font-family:"IBM Plex Mono",monospace; font-size:19px; font-weight:600; margin-top:1px; }
  .stat-tile.bad .val{ color:var(--bad); }
  .stat-tile.hot .val{ color:var(--warm); }
  .side-card{ padding:16px; }
  .side-card h3{ font-size:18px; margin-bottom:10px; }
  .size-switch{ display:flex; gap:6px; }
  .size-switch button{ flex:1; padding:8px 0; border-radius:10px; border:2px solid var(--line-strong); background:var(--paper-raised); color:var(--ink-soft); font-weight:700; cursor:pointer; }
  .size-switch button.active{ background:var(--mc); border-color:var(--mc); color:var(--on-mc); }
  .my-best{ font-size:13px; margin:10px 0 0; color:var(--ink-soft); }

  .mini-rank{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .mini-rank li{ display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:10px; background:var(--paper-sunk); font-size:13.5px; }
  .mini-rank li.me{ background:var(--warm-soft); box-shadow:inset 0 0 0 2px var(--warm); }
  .mini-rank li.gap{ background:none; justify-content:center; color:var(--muted); padding:0; }
  .mini-rank .rk{ width:24px; text-align:center; font-weight:700; flex:0 0 auto; }
  .mini-rank .av{ flex:0 0 auto; }
  .mini-rank .nm{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mini-rank .sc{ font-weight:600; flex:0 0 auto; }

  .ladder{ display:flex; align-items:center; margin:6px 0 4px; }
  .stone{ width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; background:var(--paper-sunk); border:2px solid var(--line-strong); flex:0 0 auto; color:var(--muted); }
  .stone.done{ background:var(--accent); border-color:var(--accent); color:var(--on-mc); }
  .stone.cur{ border-color:var(--mc); color:var(--mc); box-shadow:0 0 0 4px var(--mc-soft); }
  .path{ flex:1; height:4px; background:var(--line-strong); min-width:6px; }
  .path.done{ background:var(--accent); }
  .ladder-labels{ display:flex; justify-content:space-between; font-size:11px; color:var(--muted); }

  /* ---------- result ---------- */
  .result-card{ text-align:center; padding:28px 22px; border-top:7px solid var(--mc); }

<script>
(function(){
"use strict";

/* ========================= Sudoku engine ========================= */
function boxDims(n){
  if(n===4) return {bw:2,bh:2};
  if(n===6) return {bw:3,bh:2};
  return {bw:3,bh:3};
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
function isSafe(g,n,bw,bh,r,c,val){
  for(let i=0;i<n;i++){ if(g[r][i]===val) return false; if(g[i][c]===val) return false; }
  const br0=Math.floor(r/bh)*bh, bc0=Math.floor(c/bw)*bw;
  for(let i=0;i<bh;i++) for(let j=0;j<bw;j++) if(g[br0+i][bc0+j]===val) return false;
  return true;
}
function generateSolved(n){
  const {bw,bh}=boxDims(n);
  const g=Array.from({length:n},()=>Array(n).fill(0));
  function fill(pos){
    if(pos===n*n) return true;
    const r=Math.floor(pos/n), c=pos%n;
    const nums=shuffle([...Array(n)].map((_,i)=>i+1));
    for(const v of nums){
      if(isSafe(g,n,bw,bh,r,c,v)){
        g[r][c]=v;
        if(fill(pos+1)) return true;
        g[r][c]=0;
      }
    }
    return false;
  }
  fill(0);
  return g;
}
function popcount(x){ let k=0; while(x){ x&=x-1; k++; } return k; }
// 비트마스크 + MRV(후보가 가장 적은 칸부터) 백트래킹. 유일해 검증을 빠르게 하기 위함.
function solveCount(grid,n,bw,bh,limitCount,nodeBudget){
  let count=0, nodes=0, hitBudget=false;
  const boxesPerRow=n/bw;
  const boxOf=(r,c)=>Math.floor(r/bh)*boxesPerRow+Math.floor(c/bw);
  const full=(1<<(n+1))-2;
  const rows=Array(n).fill(0), cols=Array(n).fill(0), boxes=Array(n).fill(0);
  const empties=[];
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    const v=grid[r][c];
    if(v){ const b=1<<v; rows[r]|=b; cols[c]|=b; boxes[boxOf(r,c)]|=b; }
    else empties.push([r,c,boxOf(r,c)]);
  }
  const filled=new Uint8Array(empties.length);
  function backtrack(left){
    if(hitBudget||count>=limitCount) return;
    if(++nodes>nodeBudget){ hitBudget=true; return; }
    if(left===0){ count++; return; }
    let best=-1, bestMask=0, bestCnt=99;
    for(let i=0;i<empties.length;i++){
      if(filled[i]) continue;
      const [r,c,bx]=empties[i];
      const m=full & ~(rows[r]|cols[c]|boxes[bx]);
      const k=popcount(m);
      if(k<bestCnt){ best=i; bestMask=m; bestCnt=k; if(k<=1) break; }
    }
    if(bestCnt===0) return;
    const [r,c,bx]=empties[best];
    filled[best]=1;
    for(let v=1; v<=n; v++){
      const b=1<<v;
      if(!(bestMask&b)) continue;
      rows[r]|=b; cols[c]|=b; boxes[bx]|=b;
      backtrack(left-1);
      rows[r]&=~b; cols[c]&=~b; boxes[bx]&=~b;
      if(hitBudget||count>=limitCount) break;
    }
    filled[best]=0;
  }
  backtrack(empties.length);
  return {count,hitBudget};
}
function generatePuzzle(n,clueTarget){
  const {bw,bh}=boxDims(n);
  const solution=generateSolved(n);
  const puzzle=solution.map(r=>r.slice());
  const positions=shuffle([...Array(n*n).keys()]);
  let clues=n*n;
  const nodeBudget = n<=4?3000:(n<=6?12000:30000);
  for(const pos of positions){
    if(clues<=clueTarget) break;
    const r=Math.floor(pos/n), c=pos%n;
    if(puzzle[r][c]===0) continue;
    const backup=puzzle[r][c];
    puzzle[r][c]=0;
    // 예산 초과(hitBudget)면 유일해가 검증되지 않은 것이므로 제거를 포기한다.
    const {count,hitBudget}=solveCount(puzzle,n,bw,bh,2,nodeBudget);
    if(count!==1 || hitBudget) puzzle[r][c]=backup; else clues--;
  }
  return {puzzle,solution,bw,bh,n};
}
function computeCandidates(grid,n,bw,bh,r,c){
  const out=[];
  for(let v=1; v<=n; v++) if(isSafe(grid,n,bw,bh,r,c,v)) out.push(v);
  return out;
}

/* ========================= Config tables ========================= */
const TUTORIAL_CLUES = { 4:{1:10,2:8,3:6}, 6:{1:24,2:20,3:16}, 9:{1:51,2:45,3:38} };
const TUTORIAL_HINTS = {1:Infinity,2:Infinity,3:3};
const TUTORIAL_XP = {1:15,2:25,3:40};
const TUTORIAL_LABEL = {0:'규칙 알아보기',1:'첫 완주',2:'가이드 모드',3:'홀로서기',4:'사다리 완주'};
const DIFF_ORDER = ['easy','medium','hard','expert'];
const DIFF_LABEL = {easy:'쉬움',medium:'보통',hard:'어려움',expert:'전문가'};
const DIFF_CLUES = {easy:38,medium:32,hard:27,expert:20};
const DIFF_HINTS = {easy:5,medium:3,hard:2,expert:1};
const DIFF_XP = {easy:30,medium:50,hard:80,expert:120};
const MODE_ORDER = ['practice', ...DIFF_ORDER];
const MODE_META = {
  overall:{emoji:'⭐',label:'종합'}, practice:{emoji:'✏️',label:'연습'},
  easy:{emoji:'🌱',label:'쉬움'}, medium:{emoji:'🌊',label:'보통'}, hard:{emoji:'🔥',label:'어려움'}, expert:{emoji:'👑',label:'전문가'}
};
const AVATARS = ['🦊','🐼','🐯','🐧','🐰','🐻','🐸','🦁','🐨','🐙','🦄','🐳'];
// 난이도별 랭킹 기준: 보정 기록 = 걸린 시간 + 실수×10초 + 힌트×30초 (짧을수록 높은 순위)
const PENALTY_MISTAKE = 10, PENALTY_HINT = 30;

function levelFromXP(xp){ let lvl=1; while(lvl<60 && xpThreshold(lvl+1)<=xp) lvl++; return lvl; }
function xpThreshold(lvl){ return 60*(lvl-1)*lvl; }
function badgeForLevel(lvl){ if(lvl>=13) return '마스터'; if(lvl>=8) return '고수'; if(lvl>=4) return '숙련자'; return '새싹'; }
function applyPenalty(base,mistakes,hints){
  const raw = base - mistakes*3 - hints*5;
  return Math.max(Math.round(base*0.4), Math.round(raw));
}
function recordScore(sec,mistakes,hints){ return sec + mistakes*PENALTY_MISTAKE + hints*PENALTY_HINT; }
function starsFor(mistakes,hints){ if(mistakes===0 && hints===0) return 3; if(mistakes<=3 && hints<=1) return 2; return 1; }
function avatarOf(p){ return (p && AVATARS.includes(p.avatar)) ? p.avatar : '🙂'; }
function medal(i){ return i<3 ? ['🥇','🥈','🥉'][i] : String(i+1); }

/* ========================= Persistence helpers ========================= */
function safeId(str){
  const b64 = btoa(unescape(encodeURIComponent(str)));
  return b64.replace(/\//g,'_').replace(/=+$/,'') || 'x';
}
function studentKeyStr(name,classroom){ return classroom.trim()+'__'+name.trim(); }
function defaultProfile(name,classroom){
  return { studentName:name, classroom, totalXP:0, level:1, badges:[], totalCompleted:0,
    streakDays:0, lastPlayedDate:null, tutorialLevel:0, boardSizePref:null, bestDifficulty:null,
    avatar:null, bests:{}, lastMode:null };
}
function lsGet(key){ try{ const r=localStorage.getItem(key); return r?JSON.parse(r):null; }catch(e){ return null; } }
function lsSet(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

const App = {
  screen:'home', db:null, downloadsCap:null, capsReady:false,
  name:'', classroom:'', profileId:null, profile:null,
  assigned:null, session:null,
  teacher:{classroom:null,id:null,data:null,rankTab:'overall'},
  rankVis:'all', classRows:null, classRowsAt:0, rankTab:'overall',
  pendingAvatar:null, sound: lsGet('sound_on')===true
};

// 캡서빌리티 협상은 수 초 걸릴 수 있다. db와 downloads를 병렬로 요청하고,
// 응답이 없으면 CAPS_TIMEOUT_MS 뒤 db 없음(localStorage 폴백)으로 확정한다.
const CAPS_TIMEOUT_MS = 15000;
function useCap(name){
  if(!(window.claude && typeof window.claude.use==='function')) return Promise.resolve(null);
  return new Promise(resolve=>{
    const t=setTimeout(()=>resolve(null), CAPS_TIMEOUT_MS);
    Promise.resolve().then(()=>window.claude.use(name))
      .then(v=>{ clearTimeout(t); resolve(v||null); }, ()=>{ clearTimeout(t); resolve(null); });
  });
}
function initCaps(){
  useCap('downloads').then(c=>{ App.downloadsCap=c; });
  return useCap('db').then(db=>{
    App.db = db; App.capsReady = true;
    const warn = document.getElementById('teacher-db-warn');
    if(warn) warn.hidden = !!App.db;
  });
}
// 첫 화면은 기다리지 않고 그리되, db를 쓰는 동작(입장·교사 로그인)은 db 협상이 끝날 때까지 기다린다.
// 기다리지 않으면 db 없이 기본 프로필로 시작했다가, 나중에 db가 붙은 뒤 서버 기록을 덮어쓸 수 있다.
// (타임아웃 이후 늦게 도착한 db는 같은 이유로 쓰지 않는다 — Promise는 한 번만 resolve된다.)
let capsPromise = null;
function capsReady(){ return capsPromise || (capsPromise = initCaps()); }

async function loadProfile(name,classroom){
  const key = studentKeyStr(name,classroom);
  const id = safeId(key);
  let profile = lsGet('sp_'+id);
  if(App.db){
    try{
      const snap = await App.db.doc('profiles/'+id).get();
      // snap.data()는 동결(frozen) 객체라 그대로 수정하면 strict 모드에서 오류 — 깊은 복사
      if(snap.exists) profile = JSON.parse(JSON.stringify(snap.data()));
    }catch(e){}
  }
  // 예전 버전에서 저장된 문서에 빠진 필드가 있어도 동작하도록 기본값과 병합
  profile = Object.assign(defaultProfile(name,classroom), profile||{});
  if(!Array.isArray(profile.badges)) profile.badges=[];
  if(!profile.bests || typeof profile.bests!=='object') profile.bests={};
  return {id,key,profile};
}
function saveProfile(id,profile){
  lsSet('sp_'+id, profile);
  if(App.db){
    App.db.doc('profiles/'+id).set(profile).catch(()=>{ toast('온라인 동기화 실패 — 이 기기에만 저장됐어요'); });
  }
}
function recordSession(id,doc){
  const arr = lsGet('ss_'+id) || [];
  arr.unshift(doc);
  if(arr.length>50) arr.length=50;
  lsSet('ss_'+id, arr);
  if(App.db){
    App.db.collection('sessions').add(Object.assign({studentKeyId:id}, doc)).catch(()=>{});
  }
}
async function getClassConfig(classroom){
  const id = safeId(classroom.trim());
  if(!App.db) return {id,data:null};
  try{
    const snap = await App.db.doc('classConfig/'+id).get();
    return {id, data: snap.exists?snap.data():null};
  }catch(e){ return {id,data:null}; }
}
// 학급 프로필 목록(랭킹용). 20초 캐시, 내 최신 프로필은 서버 반영 전이라도 항상 덮어써서 보여준다.
async function fetchClassRows(force){
  if(!App.db || !App.classroom) return null;
  if(force || !App.classRows || Date.now()-App.classRowsAt>20000){
    const [q,cc] = await Promise.all([
      App.db.collection('profiles').where('classroom','==',App.classroom).get(),
      getClassConfig(App.classroom)
    ]);
    App.classRows = q.docs.map(d=>JSON.parse(JSON.stringify(d.data())));
    App.classRowsAt = Date.now();
    if(cc.data) App.rankVis = cc.data.rankingVisibility || 'all';
  }
  const rows = App.classRows.filter(r=>r.studentName!==App.name);
  if(App.profile) rows.push(App.profile);
  return rows;
}
function bestOf(r,mode){
  const b = r && r.bests && r.bests[mode];
  return (b && isFinite(+b.score)) ? b : null;
}
function sortForMode(rows,mode){
  if(mode==='overall') return rows.slice().sort((a,b)=>(+b.totalXP||0)-(+a.totalXP||0));
  return rows.filter(r=>bestOf(r,mode))
    .sort((a,b)=> (+bestOf(a,mode).score) - (+bestOf(b,mode).score) || String(bestOf(a,mode).at).localeCompare(String(bestOf(b,mode).at)));
}
function visibleSlice(sorted,vis){
  if(vis==='top3') return sorted.slice(0,3);
  if(vis==='top50') return sorted.slice(0, Math.max(1,Math.ceil(sorted.length/2)));
  return sorted;
}
function scoreText(r,mode){
  if(mode==='overall') return `${+r.totalXP||0} XP`;
  return fmtTime(+bestOf(r,mode).score||0);
}

/* ========================= UI helpers ========================= */
const view = document.getElementById('view');
const topbarInfo = document.getElementById('topbar-info');
const navRank = document.getElementById('nav-rank');
const navTeacher = document.getElementById('nav-teacher');
const btnSwitch = document.getElementById('btn-switch');
const btnHome = document.getElementById('btn-home');
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ t.hidden=true; },2800);
}
function showLoading(msg){ document.getElementById('loading-text').textContent=msg||'퍼즐 만드는 중…'; document.getElementById('loading').hidden=false; }
function hideLoading(){ document.getElementById('loading').hidden=true; }
function esc(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtTime(s){ s=Math.max(0,Math.round(+s||0)); const m=Math.floor(s/60), sec=s%60; return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'); }
function reducedMotion(){ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }

// 브라우저 confirm()은 아티팩트 iframe에서 막힐 수 있어 자체 모달을 쓴다. html은 이 파일에서 만든(이스케이프된) 문자열만 넣는다.
let modalResolve=null;
function confirmModal(html, okLabel){
  document.getElementById('modal-msg').innerHTML=html;
  document.getElementById('modal-ok').textContent=okLabel||'확인';
  document.getElementById('modal').hidden=false;
  document.getElementById('modal-cancel').focus();
  return new Promise(res=>{ modalResolve=res; });
}
function closeModal(val){
  const m=document.getElementById('modal');
  if(m.hidden) return;
  m.hidden=true;
  const r=modalResolve; modalResolve=null;
  if(r) r(val);
}
document.getElementById('modal-ok').addEventListener('click',()=>closeModal(true));
document.getElementById('modal-cancel').addEventListener('click',()=>closeModal(false));

/* ---------- 효과음 (기본 꺼짐) ---------- */
let audioCtx=null;
function sfx(kind){
  if(!App.sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const seq = kind==='good' ? [[880,.08]] : kind==='bad' ? [[196,.16]] : [[523,.11],[659,.11],[784,.11],[1047,.26]];
    let t = audioCtx.currentTime;
    seq.forEach(([f,d])=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type = kind==='bad' ? 'square' : 'sine';
      o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(kind==='bad'?0.08:0.18,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t+d+0.02);
      t += d*0.9;
    });
  }catch(e){}
}
/* ---------- 완료 축하 색종이 ---------- */
function confetti(){
  if(reducedMotion()) return;
  const cv=document.createElement('canvas');
  let ctx=null;
  try{ ctx=cv.getContext('2d'); }catch(e){}
  if(!ctx) return;
  cv.className='confetti'; document.body.appendChild(cv);
  const dpr=window.devicePixelRatio||1, W=window.innerWidth, H=window.innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; ctx.scale(dpr,dpr);
  const cols=['#2E9B55','#2C74CC','#E0662A','#8A4BD3','#E9A90C','#E5487A'];
  const ps=Array.from({length:150},(_,i)=>({
    x:W/2+(Math.random()-.5)*W*.35, y:H*.38, vx:(Math.random()-.5)*13, vy:-Math.random()*13-4,
    r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, w:6+Math.random()*6, h:8+Math.random()*9, c:cols[i%cols.length]
  }));
  const t0=performance.now(), DUR=2300;
  (function frame(now){
    const el=now-t0;
    ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{
      p.vy+=0.34; p.x+=p.vx; p.y+=p.vy; p.vx*=0.99; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.globalAlpha=Math.max(0,1-el/DUR); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    if(el<DUR) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

function endSession(){
  if(App.session && App.session.timerHandle) clearInterval(App.session.timerHandle);
  App.session=null;
}
function pauseSession(){
  const s=App.session;
  if(s && !s.done && !s.pausedAt) s.pausedAt=Date.now();
}
function resumeSession(){
  const s=App.session;
  if(!s || s.done) return false;
  if(s.pausedAt){ s.startedAt += Date.now()-s.pausedAt; s.pausedAt=null; }
  renderPlay();
  return true;
}
// 진행 중인 퍼즐이 있으면 홈/사용자 전환 전에 확인, 랭킹/교사 화면으로 갈 때는 일시정지해 두었다가 돌아오면 이어서 푼다.
async function navigate(target){
  const s=App.session;
  const live = s && !s.done;
  if(target==='home' || target==='switch'){
    if(live && s.moves>0){
      const ok = await confirmModal('진행 중인 퍼즐을 그만둘까요?<br><span class="hint">지금까지 푼 내용은 저장되지 않아요.</span>','그만두기');
      if(!ok) return;
    }
    endSession();
    if(target==='switch'){
      App.name=''; App.classroom=''; App.profile=null; App.profileId=null; App.assigned=null;
      App.classRows=null; App.classRowsAt=0;
    }
    renderHome();
    return;
  }
  if(live && App.screen==='play') pauseSession();
  if(target==='ranking'){
    // 진행 중이거나 방금 끝낸 퍼즐이 난이도 모드면 그 난이도 탭으로 연다
    if(s && DIFF_ORDER.includes(s.mode)) App.rankTab=s.mode;
    renderRanking();
  } else if(target==='teacher'){
    if(App.teacher.id) renderTeacherDashboard(); else renderTeacherLogin();
  }
}

async function doEntry(name,classroom,avatar){
  showLoading('내 기록을 불러오는 중…');
  try{
    await capsReady();
    App.name=name; App.classroom=classroom; App.classRows=null; App.classRowsAt=0;
    const {id,profile} = await loadProfile(name,classroom);
    App.profileId=id; App.profile=profile;
    if(AVATARS.includes(avatar) && profile.avatar!==avatar){ profile.avatar=avatar; saveProfile(id,profile); }
    else if(!AVATARS.includes(profile.avatar)){ profile.avatar=AVATARS[Math.floor(Math.random()*AVATARS.length)]; saveProfile(id,profile); }
    lsSet('last_login',{name,classroom,avatar:profile.avatar});
    const cc = await getClassConfig(classroom);
    App.assigned = (cc.data && cc.data.isAssigned) ? {size:+cc.data.assignedBoardSize||9, level:+cc.data.assignedLevel||0} : null;
    App.rankVis = (cc.data && cc.data.rankingVisibility) || 'all';
  }finally{ hideLoading(); }
  routeAfterEntry();
}

function practiceLevel(){ return Math.min(Math.max(App.profile.tutorialLevel,1),3); }
function defaultMode(){
  const p=App.profile;
  if(MODE_ORDER.includes(p.lastMode)) return p.lastMode;
  return p.tutorialLevel<4 ? 'practice' : 'easy';
}
// 교사 일괄 지정: Lv.1~3이면 연습 탭만, '난이도 도전'(Lv.4)이면 4개 난이도 탭만 쓸 수 있다.
function modeLocked(mode){
  if(!App.assigned) return false;
  if(App.assigned.level>=4) return mode==='practice';
  return mode!=='practice';
}
function routeAfterEntry(){
  renderTopbar();
  const p=App.profile;
  if(App.assigned){
    const a=App.assigned;
    if(a.level>=4){ startMode(DIFF_ORDER.includes(p.lastMode)?p.lastMode:'easy'); return; }
    // 규칙 화면은 교사가 Lv.0을 지정했거나, 학생이 아직 한 번도 보지 않았을 때만
    if(a.level===0 || p.tutorialLevel===0){ renderRules(); return; }
    startPractice(a.level, a.size);
    return;
  }
  if(p.tutorialLevel===0){ renderRules(); return; }
  startMode(defaultMode());
}

/* ========================= Puzzle session ========================= */
function startMode(mode){
  if(mode==='practice'){
    if(App.assigned && App.assigned.level<4){ startPractice(Math.max(App.assigned.level,1), App.assigned.size); return; }
    if(!App.profile.boardSizePref){ endSession(); renderSizeSelect(); return; }
    startPractice(practiceLevel(), App.profile.boardSizePref);
    return;
  }
  startFreePuzzle(mode);
}
function startPractice(level, size){
  showLoading('연습 퍼즐을 만드는 중…');
  setTimeout(()=>{
    try{
      const clues = (TUTORIAL_CLUES[size]||TUTORIAL_CLUES[9])[level] || Math.round(size*size*0.55);
      const data = generatePuzzle(size, clues);
      beginSession({kind:'tutorial', mode:'practice', level, size, data, hintsMax: TUTORIAL_HINTS[level], autoCandidates: level===2});
    }finally{ hideLoading(); }
  }, 30);
}
function startFreePuzzle(difficulty){
  showLoading('퍼즐을 만드는 중…');
  setTimeout(()=>{
    try{
      const data = generatePuzzle(9, DIFF_CLUES[difficulty]);
      beginSession({kind:'free', mode:difficulty, difficulty, size:9, data, hintsMax: DIFF_HINTS[difficulty], autoCandidates:false});
    }finally{ hideLoading(); }
  }, 30);
}
function beginSession(cfg){
  endSession();
  const n = cfg.size;
  const given = cfg.data.puzzle.map(row=>row.map(v=>v!==0));
  const s = App.session = {
    kind:cfg.kind, mode:cfg.mode, level:cfg.level, difficulty:cfg.difficulty, size:n,
    bw:cfg.data.bw, bh:cfg.data.bh, solution:cfg.data.solution,
    grid: cfg.data.puzzle.map(r=>r.slice()), given,
    toFill: given.flat().filter(g=>!g).length,
    notes:{}, selected:null, mistakes:0, hintsUsed:0, hintsTaken:0, hintsMax:cfg.hintsMax,
    autoCandidates:!!cfg.autoCandidates, notesMode:false,
    startedAt:Date.now(), elapsed:0, timerHandle:null, hintedCells:{},
    moves:0, combo:0, maxCombo:0, done:false, pausedAt:null
  };
  App.profile.lastMode = cfg.mode;
  renderPlay();
  s.timerHandle = setInterval(()=>{
    if(s.done || s.pausedAt) return;
    s.elapsed = Math.floor((Date.now()-s.startedAt)/1000);
    const el = document.getElementById('stat-timer');
    if(el && App.session===s && App.screen==='play') el.textContent = fmtTime(s.elapsed);
  },1000);
}

          ${s.autoCandidates ? '<div class="card side-card" style="font-size:13px;color:var(--ink-soft);">💡 <b>가이드 모드</b> — 빈 칸에 넣을 수 있는 숫자가 작게 표시돼요.</div>' : ''}
          ${(s.mode==='practice' && !App.assigned) ? `<div class="card side-card"><h3>연습 보드 크기</h3><div class="size-switch">${[4,6,9].map(n=>`<button data-action="practice-size" data-size="${n}" class="${s.size===n?'active':''}">${n}×${n}</button>`).join('')}</div></div>` : ''}
          <div class="card side-card" id="side-rank"></div>
        </div>
      </div>
    </div>`;
  buildBoard();
  buildPad();
  renderBoard();
  renderSideRank();
}
function buildBoard(){
  const s=App.session, n=s.size;
  const board=document.getElementById('board');
  board.style.gridTemplateColumns = `repeat(${n},1fr)`;
  board.style.gridTemplateRows = `repeat(${n},1fr)`;
  board.innerHTML='';
  const fontSize = n===9 ? 'clamp(17px,4.6vw,24px)' : (n===6 ? 'clamp(22px,6vw,30px)' : 'clamp(28px,8vw,40px)');
  for(let r=0;r<n;r++){
    for(let c=0;c<n;c++){
      const cell=document.createElement('div');
      cell.className='cell';
      cell.dataset.r=r; cell.dataset.c=c;
      cell.dataset.action='cell';
      cell.style.fontSize=fontSize;
      cell.style.borderRight = ((c+1)%s.bw===0 && c!==n-1) ? '2.5px solid var(--ink)' : '1px solid var(--line)';
      cell.style.borderBottom = ((r+1)%s.bh===0 && r!==n-1) ? '2.5px solid var(--ink)' : '1px solid var(--line)';
      board.appendChild(cell);
    }
  }
}
function buildPad(){
  const s=App.session;
  const pad=document.getElementById('pad');
  pad.style.gridTemplateColumns = `repeat(${s.size},1fr)`;
  pad.innerHTML='';
  for(let v=1; v<=s.size; v++){
    const b=document.createElement('button');
    b.dataset.action='num'; b.dataset.val=v;
    b.innerHTML=`${v}<span class="pc"></span>`;
    pad.appendChild(b);
  }
}
function renderBoard(){
  const s=App.session, n=s.size;
  const board=document.getElementById('board');
  if(!board) return;
  const sel=s.selected;
  const selVal = sel ? s.grid[sel.r][sel.c] : 0;
  [...board.children].forEach(cell=>{
    const r=+cell.dataset.r, c=+cell.dataset.c;
    const val=s.grid[r][c];
    const isGiven=s.given[r][c];
    const isSelected = !!(sel && sel.r===r && sel.c===c);
    const isPeer = !!(sel && !isSelected && (sel.r===r || sel.c===c ||
      (Math.floor(sel.r/s.bh)===Math.floor(r/s.bh) && Math.floor(sel.c/s.bw)===Math.floor(c/s.bw))));
    const isSame = !!(selVal && !isSelected && val===selVal);
    const isError = val!==0 && !isGiven && val!==s.solution[r][c];
    cell.classList.toggle('selected', isSelected);
    cell.classList.toggle('peer', isPeer && !isSame);
    cell.classList.toggle('same', isSame);
    cell.classList.toggle('error', isError);
    cell.classList.toggle('given', isGiven);
    cell.classList.toggle('user', !isGiven && val!==0);
    cell.classList.toggle('hinted', !!s.hintedCells[r+','+c]);
    cell.setAttribute('aria-label', `${r+1}행 ${c+1}열 ${val||'빈 칸'}`);
    cell.innerHTML='';
    if(val!==0){
      const span=document.createElement('span');
      span.className='v'; span.textContent=val;
      cell.appendChild(span);
    } else {
      let nums=[];
      if(s.autoCandidates){ nums=computeCandidates(s.grid,n,s.bw,s.bh,r,c); }
      else if(s.notes[r+','+c] && s.notes[r+','+c].size){ nums=[...s.notes[r+','+c]]; }
      if(nums.length){
        const g=document.createElement('div');
        g.className='notes-grid';
        g.style.gridTemplateColumns=`repeat(${Math.ceil(Math.sqrt(n))},1fr)`;
        g.style.fontSize = n>=9 ? 'clamp(8px,2vw,10px)' : '11px';
        for(let v=1; v<=n; v++){
          const sp=document.createElement('span');
          sp.textContent = nums.includes(v)?v:'';
          g.appendChild(sp);
        }
        cell.appendChild(g);
      }
    }
  });
  // 숫자 패드: 정답으로 채워야 할 남은 개수
  const placed=Array(n+1).fill(0);
  let correctUser=0;
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    if(s.grid[r][c]===s.solution[r][c]){ placed[s.grid[r][c]]++; if(!s.given[r][c]) correctUser++; }
  }
  document.querySelectorAll('#pad button').forEach(b=>{
    const v=+b.dataset.val, left=n-placed[v];
    b.querySelector('.pc').textContent = left>0 ? left : '✓';
    b.classList.toggle('done', left<=0);
    b.setAttribute('aria-label', `${v} 입력, 남은 개수 ${Math.max(0,left)}`);
  });
  const pct = s.toFill ? Math.round(correctUser/s.toFill*100) : 100;
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-text').textContent = `${correctUser}/${s.toFill}칸 · ${pct}%`;
  document.getElementById('stat-mistakes').textContent = s.mistakes;
  document.getElementById('tile-mistakes').classList.toggle('bad', s.mistakes>0);
  document.getElementById('stat-combo').textContent = s.combo;
  document.getElementById('tile-combo').classList.toggle('hot', s.combo>=3);
  const notesBtn = document.getElementById('btn-notes');
  if(notesBtn) notesBtn.classList.toggle('active', s.notesMode);
  const hb=document.getElementById('btn-hint');
  if(hb) hb.textContent=`💡 힌트 (${s.hintsMax===Infinity?'무제한':Math.max(0,s.hintsMax-s.hintsUsed)})`;
}
function cellEl(r,c){ return document.querySelector(`#board .cell[data-r="${r}"][data-c="${c}"]`); }
function animateCells(cells,cls){
  if(reducedMotion()) return;
  cells.forEach(([r,c])=>{
    const el=cellEl(r,c); if(!el) return;
    el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
    setTimeout(()=>el.classList.remove(cls), 850);
  });
}
function showCombo(n){
  const el=document.getElementById('combo-pop');
  if(!el || reducedMotion()) return;
  el.textContent = n>=8 ? `🔥 콤보 ×${n} 대단해요!` : `⚡ 콤보 ×${n}!`;
  el.hidden=false; el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  clearTimeout(showCombo.t); showCombo.t=setTimeout(()=>{ el.hidden=true; }, 950);
}
// 방금 채운 칸 때문에 완성된 가로줄·세로줄·박스의 칸 목록
function completedUnitCells(r,c){
  const s=App.session, n=s.size, out=[];
  const ok=(rr,cc)=>s.grid[rr][cc]===s.solution[rr][cc];
  if([...Array(n).keys()].every(cc=>ok(r,cc))) for(let cc=0;cc<n;cc++) out.push([r,cc]);
  if([...Array(n).keys()].every(rr=>ok(rr,c))) for(let rr=0;rr<n;rr++) out.push([rr,c]);
  const br=Math.floor(r/s.bh)*s.bh, bc=Math.floor(c/s.bw)*s.bw, box=[];
  for(let i=0;i<s.bh;i++) for(let j=0;j<s.bw;j++) box.push([br+i,bc+j]);
  if(box.every(([rr,cc])=>ok(rr,cc))) out.push(...box);
  return out;
}
function clearPeerNotes(r,c,v){
  const s=App.session;
  Object.keys(s.notes).forEach(k=>{
    const [rr,cc]=k.split(',').map(Number);
    if(rr===r || cc===c || (Math.floor(rr/s.bh)===Math.floor(r/s.bh) && Math.floor(cc/s.bw)===Math.floor(c/s.bw))) s.notes[k].delete(v);
  });
}
function selectCell(r,c){
  const s=App.session;
  if(!s) return;
  // 주어진 칸도 선택(강조)은 허용한다 — 입력/지우기/힌트는 각 함수에서 막는다.
  s.selected={r,c};
  renderBoard();
}
function inputNumber(v){
  const s=App.session;
  if(!s || s.done || !s.selected) return;
  const {r,c}=s.selected;
  if(s.given[r][c]) return;
  if(s.notesMode && !s.autoCandidates && s.grid[r][c]===0){
    const key=r+','+c;
    if(!s.notes[key]) s.notes[key]=new Set();
    if(s.notes[key].has(v)) s.notes[key].delete(v); else s.notes[key].add(v);
    renderBoard();
    return;
  }
  if(s.grid[r][c]===v) return;
  s.grid[r][c]=v; s.moves++;
  delete s.notes[r+','+c];
  const correct = v===s.solution[r][c];
  if(correct){
    s.combo++; s.maxCombo=Math.max(s.maxCombo,s.combo);
    clearPeerNotes(r,c,v);
  } else {
    s.mistakes++; s.combo=0;
  }
  renderBoard();
  if(correct){
    sfx('good');
    animateCells([[r,c]],'pop');
    const unit=completedUnitCells(r,c);
    if(unit.length) animateCells(unit,'flash');
    if(s.combo>=3) showCombo(s.combo);
  } else {
    sfx('bad');
    animateCells([[r,c]],'shake');
  }
  checkComplete();
}
function eraseCell(){
  const s=App.session;
  if(!s || s.done || !s.selected) return;
  const {r,c}=s.selected;
  if(s.given[r][c]) return;
  s.grid[r][c]=0;
  delete s.notes[r+','+c];
  renderBoard();
}
function useHint(){
  const s=App.session;
  if(!s || s.done) return;
  if(!s.selected){ toast('먼저 칸을 선택해 주세요.'); return; }
  if(s.hintsMax!==Infinity && s.hintsUsed>=s.hintsMax){ toast('힌트를 모두 사용했어요.'); return; }
  const {r,c}=s.selected;
  if(s.given[r][c]){ toast('처음부터 주어진 칸이에요.'); return; }
  if(s.grid[r][c]===s.solution[r][c]){ toast('이미 맞는 칸이에요.'); return; }
  s.grid[r][c]=s.solution[r][c];
  s.hintedCells[r+','+c]=true;
  delete s.notes[r+','+c];
  clearPeerNotes(r,c,s.solution[r][c]);
  if(s.hintsMax!==Infinity) s.hintsUsed++;
  s.hintsTaken++; s.moves++;
  renderBoard();
  animateCells([[r,c]],'pop');
  checkComplete();
}
function toggleNotes(){
  const s=App.session;
  if(!s || s.autoCandidates) return;
  s.notesMode=!s.notesMode;
  renderBoard();
}
function toggleSound(){
  App.sound=!App.sound;
  lsSet('sound_on', App.sound);
  const b=document.getElementById('btn-sound');
  if(b){ b.textContent = App.sound?'🔊 소리':'🔇 소리'; b.setAttribute('aria-pressed',App.sound); }
  if(App.sound) sfx('good');
}
async function switchMode(mode){
  if(!MODE_ORDER.includes(mode) || !App.profile) return;
  if(modeLocked(mode)){ toast('선생님이 지정한 단계만 할 수 있어요.'); return; }
  const s=App.session;
  if(s && !s.done && s.mode===mode && App.screen==='play') return;
  if(s && !s.done && s.moves>0){
    const ok = await confirmModal(`${MODE_META[mode].emoji} ${MODE_META[mode].label}(으)로 바꿀까요?<br><span class="hint">지금 풀던 퍼즐은 저장되지 않아요.</span>`,'바꾸기');
    if(!ok) return;
  }
  startMode(mode);
}
async function changePracticeSize(n){
  const s=App.session;
  if(![4,6,9].includes(n) || (s && s.size===n)) return;
  if(s && !s.done && s.moves>0){
    const ok = await confirmModal(`${n}×${n} 보드로 바꿀까요?<br><span class="hint">지금 풀던 퍼즐은 저장되지 않아요.</span>`,'바꾸기');
    if(!ok) return;
  }
  App.profile.boardSizePref=n;
  saveProfile(App.profileId, App.profile);
  startPractice(practiceLevel(), n);
}
function checkComplete(){
  const s=App.session;
  for(let r=0;r<s.size;r++) for(let c=0;c<s.size;c++) if(s.grid[r][c]!==s.solution[r][c]) return;
  completeSession();
}

function miniRankHTML(rows,mode){

/* ========================= Completion & result ========================= */
function completeSession(){
  const s=App.session;
  if(s.done) return;
  s.done=true;
  clearInterval(s.timerHandle);
  s.elapsed=Math.max(1,Math.floor((Date.now()-s.startedAt)/1000));
  const p=App.profile;
  const base = s.kind==='tutorial' ? (TUTORIAL_XP[s.level]||20) : DIFF_XP[s.difficulty];
  const xp = applyPenalty(base, s.mistakes, s.hintsUsed);
  const stars = starsFor(s.mistakes, s.hintsTaken);
  const today = new Date().toDateString();
  let streakBonus=0;
  if(p.lastPlayedDate!==today){
    const yest = new Date(Date.now()-86400000).toDateString();
    p.streakDays = (p.lastPlayedDate===yest) ? (p.streakDays||0)+1 : 1;
    p.lastPlayedDate = today;
    streakBonus = 10;
  }
  p.totalXP = (p.totalXP||0) + xp + streakBonus;
  p.level = levelFromXP(p.totalXP);
  const badge = badgeForLevel(p.level);
  const isNewBadge = !p.badges.includes(badge);
  if(isNewBadge) p.badges.push(badge);
  p.totalCompleted = (p.totalCompleted||0)+1;
  p.lastMode = s.mode;
  let graduated=false, record=null, newBest=false, prevBest=null;
  if(s.kind==='tutorial'){
    const next = Math.min(s.level+1,4);
    if(next>p.tutorialLevel){ p.tutorialLevel=next; graduated = next===4; }
  } else {
    const idx=DIFF_ORDER.indexOf(s.difficulty);
    const cur=p.bestDifficulty?DIFF_ORDER.indexOf(p.bestDifficulty):-1;
    if(idx>cur) p.bestDifficulty=s.difficulty;
    record = { score:recordScore(s.elapsed,s.mistakes,s.hintsTaken), sec:s.elapsed, mistakes:s.mistakes, hints:s.hintsTaken, at:new Date().toISOString() };
    prevBest = bestOf(p,s.difficulty);
    if(!prevBest || record.score < +prevBest.score){
      p.bests = Object.assign({}, p.bests, {[s.difficulty]:record});
      newBest = true;
    }
  }
  saveProfile(App.profileId, p);
  recordSession(App.profileId, {
    studentName:App.name, classroom:App.classroom, kind:s.kind, level:s.level||null, difficulty:s.difficulty||null,
    boardSize:s.size, durationSec:s.elapsed, mistakeCount:s.mistakes, hintCount:s.hintsTaken,
    completed:true, xpEarned:xp+streakBonus, stars, maxCombo:s.maxCombo, recordScore: record?record.score:null,
    startedAt:new Date(Date.now()-s.elapsed*1000).toISOString(), finishedAt:new Date().toISOString()
  });
  App.classRowsAt=0;
  sfx('win');
  renderResult({xp,streakBonus,badge,isNewBadge,graduated,stars,record,newBest,prevBest});
  confetti();
}
function renderResult({xp,streakBonus,badge,isNewBadge,graduated,stars,record,newBest,prevBest}){
  App.screen='result';
  renderTopbar();
  const s=App.session, p=App.profile, meta=MODE_META[s.mode];
  const lvl=p.level;
  const curFloor=xpThreshold(lvl), nextFloor=xpThreshold(lvl+1);
  const pct = Math.min(100, Math.round((p.totalXP-curFloor)/(nextFloor-curFloor)*100));
  const starHTML = [1,2,3].map(i=>`<span class="star ${i<=stars?'on':''}" style="animation-delay:${0.15+i*0.18}s">★</span>`).join('');
  const recordHTML = record ? `
    <div class="record-box">
      <div class="lab">보정 기록</div>
      <div class="big mono">${fmtTime(record.score)}</div>
      <div class="sub">시간 ${fmtTime(record.sec)} + 실수 ${record.mistakes}×${PENALTY_MISTAKE}초 + 힌트 ${record.hints}×${PENALTY_HINT}초</div>
      ${newBest ? `<p class="newbest">🎉 ${prevBest?'내 최고 기록 갱신!':'첫 기록 등록!'}</p>` : `<p class="hint">내 최고 기록 ${fmtTime(prevBest.score)}</p>`}
      <p class="rank-line" id="result-rank"></p>
    </div>` : '';
  view.innerHTML = `
    <div class="center-wrap m-${s.mode}">
      <div class="card result-card">
        <p class="stage-tag">${meta.emoji} ${meta.label}${s.kind==='tutorial'?` · LV.${s.level} ${TUTORIAL_LABEL[s.level]}`:''} 완료!</p>
        <div class="stars" role="img" aria-label="별 ${stars}개">${starHTML}</div>
        <div class="xp-burst">+${xp+streakBonus} XP</div>
        ${s.maxCombo>=3 ? `<p class="hint">⚡ 최대 콤보 ×${s.maxCombo}</p>`:''}
        ${streakBonus? `<p style="color:var(--warm-ink);font-weight:700;margin:6px 0 0;">🔥 ${p.streakDays}일 연속 참여 보너스 +${streakBonus}</p>`:''}
        ${isNewBadge? `<p style="color:var(--accent-ink);font-weight:700;margin:8px 0 0;">🏅 새 칭호 획득: ${badge}</p>`:''}
        ${recordHTML}
        ${graduated? `<p class="grad">🎓 학습 사다리 완주! 이제 난이도 탭에서 마음껏 도전해 보세요.</p>`:''}
        <div class="levelbar-track"><div class="levelbar-fill" style="width:${pct}%"></div></div>
        <p style="font-size:12.5px;color:var(--muted);margin:0;">Lv.${lvl} · ${badge} · 총 ${p.totalXP} XP</p>
      </div>
      <div class="btn-row" id="result-actions"></div>
    </div>`;
  const actions=document.getElementById('result-actions');
  let html;
  if(s.kind==='tutorial' && App.assigned){
    html = `<button class="btn btn-primary" data-action="result-retry">🔁 다시 도전</button>`;
  } else if(s.kind==='tutorial' && s.level<3){
    html = `<button class="btn btn-primary" data-action="result-next">다음 단계로 →</button>
            <button class="btn btn-outline" data-action="result-retry">🔁 한 판 더</button>`;
  } else if(s.kind==='tutorial'){
    html = `<button class="btn btn-mode m-easy" data-action="switch-mode" data-mode="easy">🌱 쉬움 도전하기</button>
            <button class="btn btn-outline" data-action="result-retry">✏️ 연습 한 판 더</button>`;

// 학생도 classConfig 문서를 읽을 수 있으므로 비밀번호는 평문이 아닌 해시로만 저장한다.
async function hashPass(classroom, pass){
  const bytes = new TextEncoder().encode('sudoku-classroom:'+classroom+':'+pass);
  const buf = await crypto.subtle.digest('SHA-256', bytes);
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function handleTeacherLogin(form){
  const classroom = form.querySelector('#t-class').value.trim();
  const pass = form.querySelector('#t-pass').value;
  const errEl = form.querySelector('#teacher-err');
  if(!classroom || !pass){ errEl.textContent='학급 코드와 비밀번호를 입력해 주세요.'; errEl.hidden=false; return; }
  showLoading('확인하는 중…');
  await capsReady();
  if(!App.db){ hideLoading(); errEl.textContent='로그인 상태를 확인할 수 없어 대시보드를 열 수 없어요.'; errEl.hidden=false; return; }
  try{
    const id = safeId(classroom);
    const ref = App.db.doc('classConfig/'+id);
    const snap = await ref.get();
    const hash = await hashPass(classroom, pass);
    const cur = snap.exists ? snap.data() : null;
    if(!cur || (!cur.passHash && !cur.passcode)){
      await ref.set({ classroom, passHash:hash, isAssigned:false, assignedBoardSize:9, assignedLevel:4, rankingVisibility:'all', createdAt:new Date().toISOString() });
      toast('새 학급 비밀번호가 설정됐어요.');
    } else if(cur.passHash ? cur.passHash!==hash : cur.passcode!==pass){
      hideLoading();
      errEl.textContent='비밀번호가 올바르지 않습니다.'; errEl.hidden=false; return;
    } else if(!cur.passHash){
      // 예전 버전의 평문 비밀번호를 해시로 옮기고 평문은 지운다
      await ref.update({ passHash:hash, passcode:null });
    }
    App.teacher = {classroom, id, data:null, rankTab:'overall'};
    hideLoading();
    renderTeacherDashboard();
  }catch(e){
    hideLoading();
    errEl.textContent='연결에 실패했어요. 잠시 후 다시 시도해 주세요.'; errEl.hidden=false;
  }
}

  sessions.forEach(s=>{
    lines.push([s.studentName,s.classroom,s.kind,(s.difficulty||('Lv'+s.level)),s.boardSize,s.durationSec,s.mistakeCount,s.hintCount,s.stars,s.recordScore,s.completed,s.xpEarned,s.finishedAt]

  });
  const csv = '﻿'+lines.join('\n');
  if(App.downloadsCap){
    try{
      await App.downloadsCap.save({filename:`sudoku_${App.teacher.classroom.replace(/[\\/:*?"<>|]/g,'_')}.csv`, data: csv});
      toast('CSV 파일을 저장했어요.');
    }catch(e){ toast('다운로드가 취소되었거나 실패했어요.'); }
  } else {
    toast('이 환경에서는 다운로드를 지원하지 않아요.');
  }
}

/* ========================= Event delegation ========================= */
document.addEventListener('submit', (e)=>{
  if(e.target.id==='entry-form'){ e.preventDefault(); handleEntrySubmit(e.target); }
  if(e.target.id==='teacher-login-form'){ e.preventDefault(); handleTeacherLogin(e.target); }
});

document.addEventListener('click', (e)=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  switch(action){
    case 'go-home': navigate('home'); break;
    case 'switch-user': navigate('switch'); break;
    case 'show-ranking': if(App.name) navigate('ranking'); break;
    case 'go-teacher': navigate('teacher'); break;
    case 'go-student': renderStudentEntry(); break;
    case 'quick-continue': { const l=lsGet('last_login'); if(l && l.name && l.classroom) doEntry(l.name,l.classroom,l.avatar); else renderStudentEntry(); break; }
    case 'play-now':
    case 'resume-game': if(!resumeSession()) routeAfterEntry(); break;
    case 'pick-avatar': pickAvatar(t.dataset.av); break;
    case 'rules-next': afterRules(); break;
    case 'pick-size': pickSize(+t.dataset.size); break;
    case 'practice-size': changePracticeSize(+t.dataset.size); break;
    case 'switch-mode': switchMode(t.dataset.mode); break;
    case 'cell': selectCell(+t.dataset.r, +t.dataset.c); break;
    case 'num': inputNumber(+t.dataset.val); break;
    case 'erase': eraseCell(); break;
    case 'hint': useHint(); break;
    case 'toggle-notes': toggleNotes(); break;
    case 'toggle-sound': toggleSound(); break;
    case 'give-up': navigate('home'); break;
    case 'result-next': resultNext(); break;
    case 'result-retry': resultRetry(); break;
    case 'rank-tab': App.rankTab=t.dataset.tab; renderRanking(); break;
    case 'refresh-dashboard': loadDashboardData(); break;
    case 'export-csv': exportCSV(); break;
    case 'assign-save': saveAssignment(); break;
    case 'visibility-save': saveVisibility(); break;
    case 'teacher-rank-tab': teacherRankTab(t.dataset.tab); break;
    case 'student-row': showStudentDetail(t.dataset.name); break;
  }
});

document.addEventListener('keydown',(e)=>{
  if(!document.getElementById('modal').hidden){
    if(e.key==='Escape') closeModal(false);
    return;
  }
  // tabindex로 포커스되는 카드(div)·표 행도 Enter/Space로 누를 수 있게
  if(e.key==='Enter' || e.key===' '){
    const t=e.target;
    if(t && t.matches && t.matches('div[data-action][tabindex], tr[data-action]')){ e.preventDefault(); t.click(); }
    return;
  }
  if(App.screen!=='play' || !App.session) return;
  if(e.target && e.target.matches && e.target.matches('input, select, textarea')) return;
  const s=App.session;
  if(/^[1-9]$/.test(e.key) && +e.key<=s.size){ inputNumber(+e.key); return; }
  if(e.key==='Backspace' || e.key==='Delete'){ eraseCell(); return; }
  if(e.key==='n' || e.key==='N'){ toggleNotes(); return; }
  const dirs={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
  if(!dirs[e.key]) return;
  e.preventDefault();
  if(!s.selected){ selectCell(0,0); return; }
  const [dr,dc]=dirs[e.key];
  selectCell((s.selected.r+dr+s.size)%s.size, (s.selected.c+dc+s.size)%s.size);
});

/* ========================= Boot ========================= */
renderHome();
capsReady();
})();
</script>
